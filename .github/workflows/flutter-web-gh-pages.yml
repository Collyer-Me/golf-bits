# Build Flutter Web on GitHub-hosted runners and publish to GitHub Pages.
# PRs: analyze, test, and build (no deploy). main: same checks plus GitHub Pages deploy.

name: Flutter Web → GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'golf_bits/**'
      - '.github/workflows/flutter-web-gh-pages.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'golf_bits/**'
      - '.github/workflows/flutter-web-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Node 20 on Actions is deprecated; official actions below use Node 24.
    # This also opts third-party actions (e.g. flutter-action) into Node 24 until they update.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Add web platform files (if missing)
        working-directory: golf_bits
        run: flutter create . --project-name golf_bits --org com.golfbits --platforms=web

      - name: Dependencies
        working-directory: golf_bits
        run: flutter pub get

      - name: Analyze
        working-directory: golf_bits
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: golf_bits
        run: flutter test

      # Repository secrets: SUPABASE_URL, SUPABASE_ANON_KEY (Dashboard → Settings → API).
      # If unset, the app builds but auth shows “not configured” until you add secrets and redeploy.
      # Custom domain (bitsdotsjunk.com) serves from site root; use "/" not "/repo-name/".
      - name: Build web
        working-directory: golf_bits
        env:
          BASE_HREF: /
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release --base-href "$BASE_HREF" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=BUILD_SHA="${{ github.sha }}" \
            --dart-define=APP_VERSION="1.0.0-beta.1"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: golf_bits/build/web
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: golf_bits/build/web

      - name: Upload Pages artifact
        # Pin full semver: @v5 is not always published as a moving tag for this action.
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: golf_bits/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

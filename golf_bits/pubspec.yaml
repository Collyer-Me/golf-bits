name: golf_bits
description: Golf Bits — side-bet ("bits") scoring for golf rounds. Flutter + Material 3.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  # Cap below 2.15.0: that release adds the `passkeys` feature, pulling in the
  # `passkeys_web` plugin. Its web registration calls
  # `window['PasskeyAuthenticator'].init()`, which is undefined unless a passkeys
  # JS SDK <script> is present in index.html — so on web (GitHub Pages) it throws
  # "Cannot read properties of undefined (reading 'init')" during plugin
  # registration and blanks the whole app. This app uses email/password + guest
  # auth only (no passkeys). Revisit when we add a committed pubspec.lock.
  supabase_flutter: '>=2.8.0 <2.15.0'
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Native launcher icons. Web favicon + PWA icons are committed under web/ and
# need no build step. For Android/iOS, after `flutter create` generates those
# platform folders, run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/app-icon.png"
  adaptive_icon_background: "#0D2B1C"
  adaptive_icon_foreground: "assets/brand/app-icon.png"
  web:
    generate: false

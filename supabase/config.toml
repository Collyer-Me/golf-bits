# Minimal Supabase CLI config — extend as needed for local development.

[auth]
enabled = true
# Required for "Continue as guest" / anonymous round history. Also enable in the
# hosted project: Dashboard → Authentication → Providers → Anonymous sign-ins.
enable_anonymous_sign_ins = true

[api]
enabled = true

[functions]
# Edge Functions verify JWT by default in hosted Supabase; CLI respects per-function overrides.

[functions.search-courses]
verify_jwt = true

[functions.get-course-detail]
verify_jwt = true

[functions.sync-course-by-name]
verify_jwt = true
